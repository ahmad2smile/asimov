[package]
name = "ingest-core"
description = "Shared parts of the MQTT ingest services: config, MQTT source, VDA 5050 decoding, telemetry, health, supervision"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
chrono = { workspace = true, features = ["clock"] }
fastrand = "2"
gethostname = "1"
opentelemetry = { version = "0.33", features = ["metrics"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["grpc-tonic", "metrics"] }
opentelemetry_sdk = { version = "0.33", features = ["metrics", "rt-tokio"] }
rumqttc.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util = "0.7"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
asimov-simulator.workspace = true
tokio = { workspace = true, features = ["test-util"] }
