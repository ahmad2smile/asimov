[package]
name = "asimov-simulator"
description = "Simulated warehouse AGV fleet publishing VDA 5050 2.1.0 messages over MQTT"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
rumqttc = { version = "0.25", default-features = false, features = ["url"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
jsonschema = "0.58"
